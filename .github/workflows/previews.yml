name: Previews
on:
  push:
    branches: [main, dev]
    paths: ["kx/**", "scripts/make_previews.py", "Example Usage.ipynb", "uv.lock", ".github/workflows/previews.yml"]
  pull_request:
    paths: ["kx/**", "scripts/make_previews.py", "Example Usage.ipynb", "uv.lock", ".github/workflows/previews.yml"]
  workflow_dispatch:

concurrency:
  group: previews-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - run: uv sync --locked

      - name: Render theme PNGs
        run: uv run --locked scripts/make_previews.py "$RUNNER_TEMP/previews"

      - name: Execute Example Usage.ipynb
        run: >
          uv run --locked --with nbconvert --with ipykernel
          jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.record_timing=False
          --output-dir "$RUNNER_TEMP/previews" "Example Usage.ipynb"

      - name: Upload for review
        uses: actions/upload-artifact@v4
        with:
          name: previews
          path: ${{ runner.temp }}/previews
          retention-days: 7
