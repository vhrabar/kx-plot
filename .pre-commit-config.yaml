default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches pyproject.toml (tests.yml, uv sync --locked)
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff
        name: ruff check --fix, staged files (tests.yml)
        entry: uv run --locked ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types: [python]

      - id: changelog
        name: CHANGELOG.md is Keep a Changelog (changelog.yml, kacl-cli verify)
        entry: uvx --from python-kacl==0.7.3 kacl-cli verify
        language: system
        files: ^CHANGELOG\.md$
        pass_filenames: false

      - id: pytest
        name: pytest -W error (tests.yml)
        entry: env MPLBACKEND=Agg uv run --locked pytest -W error -q -p no:cacheprovider
        language: system
        files: ^(kx/|tests/|scripts/|pyproject\.toml$|uv\.lock$)
        pass_filenames: false
